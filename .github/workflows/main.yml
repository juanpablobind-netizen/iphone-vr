name: Compilar Nexus VR

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: |
          cd ios
          xcodegen generate
          xcodebuild -project NexusVR.xcodeproj -scheme NexusVR -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusVR.app Payload/
          zip -qry NexusVR-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NexusVR-iOS-sin-firmar
          path: ios/NexusVR-unsigned.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v2.5.1 https://github.com/ValveSoftware/openvr.git sdk
      - run: cmake -S driver -B build -A x64 -DOPENVR_ROOT="${{ github.workspace }}/sdk"
      - run: cmake --build build --config Release
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/nexushands"
      - uses: actions/upload-artifact@v4
        with:
          name: nexushands-driver-win64
          path: nexushands/

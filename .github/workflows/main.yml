name: Compilar Nexus VR IPA
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.github/workflows/main.yml', 'NexusVR/ios/**']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Instalar XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Compilar iOS sin firmar
        working-directory: NexusVR/ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project NexusVR.xcodeproj -scheme NexusVR -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusVR.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload NexusVR-unsigned.ipa
          test -s NexusVR-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NexusVR-iOS-sin-firmar
          path: NexusVR/ios/NexusVR-unsigned.ipa
          if-no-files-found: error
